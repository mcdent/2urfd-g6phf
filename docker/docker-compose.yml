name: urfd

services:

  # ── urfd + tcd ──────────────────────────────────────────────────────────────
  # urfd and tcd share abstract UNIX DGRAM sockets so they must be co-located.
  # privileged: true is required for rmmod ftdi_sio/usbserial and USB access.
  urfd:
    build:
      context: ..                          # repo root — contains reflector/, transcoder/ etc.
      dockerfile: docker/urfd/Dockerfile
    container_name: urfd
    restart: unless-stopped
    privileged: true
    environment:
      - ENABLE_TCD=true    # DVSI hardware connected via USB hub 05e3:0608
    devices:
      - /dev/bus/usb:/dev/bus/usb    # DVSI USB hardware passthrough
    volumes:
      # Runtime config (edit files in ./config/ before starting)
      - ./config/urfd.ini:/etc/urfd/urfd.ini:ro
      - ./config/tcd.ini:/etc/urfd/tcd.ini:ro
      - ./config/urfd.blacklist:/etc/urfd/urfd.blacklist:ro
      - ./config/urfd.whitelist:/etc/urfd/urfd.whitelist:ro
      - ./config/urfd.interlink:/etc/urfd/urfd.interlink:ro
      # Persistent state (DHT peer cache, downloaded DB files)
      - urfd-state:/var/lib/urfd
      # All logs (shared with dashboard)
      - ./logs:/logs
    networks:
      default:
        ipv4_address: 172.20.0.4   # fixed — hblink3 connects directly to this IP
    ports:
      - "10017:10017/udp"   # URF interlinking
      - "17000:17000/udp"   # M17
      - "20001:20001/udp"   # DPlus
      - "30001:30001/udp"   # DExtra
      - "30051:30051/udp"   # DCS
      - "40000:40000/udp"   # DSD
      - "41000:41000/udp"   # P25
      - "41400:41400/udp"   # NXDN
      - "42000:42000/udp"   # YSF
      - "10002:10002/udp"   # BrandMeister XLX peering
      - "62030:62030/udp"   # MMDVM (direct hotspot DMR)
      - "127.0.0.1:17171:17171/udp"   # DHT (localhost only — for dhtnode queries)

  # ── Dashboard (nginx + php-fpm) ─────────────────────────────────────────────
  dashboard:
    build:
      context: ..                              # repo root
      dockerfile: docker/dashboard/Dockerfile
    container_name: urfd-dashboard
    restart: unless-stopped
    volumes:
      # urfd.xml, urfd.pid and nginx logs all live here
      - ./logs:/logs
      # User-edited dashboard config
      - ./config/dashboard-config.inc.php:/var/www/html/pgs/config.inc.php:ro
      # nginx site config — serves dashboard at /xlx, 404 everywhere else
      - ./nginx/urfd.conf:/etc/nginx/sites-available/urfd:ro
    ports:
      - "80:80"
    depends_on:
      - urfd

  # ── Metrics (disabled by default) ───────────────────────────────────────────
  # Enable with:  docker compose --profile metrics up -d
  # Or set COMPOSE_PROFILES=metrics in a .env file for a permanent opt-in.

  urfd-exporter:
    profiles: [metrics]
    build:
      context: .                           # docker/ directory
      dockerfile: exporter/Dockerfile
    container_name: urfd-exporter
    restart: unless-stopped
    volumes:
      - ./logs:/logs:ro                    # urfd.xml and urfd.log
    ports:
      - "9101:9101"

  cadvisor:
    profiles: [metrics]
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: urfd-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --store_container_labels=false   # drop noisy compose metadata labels
      - -enable_metrics=cpu,cpuLoad,memory,network
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"

volumes:
  urfd-state:   # DHT state + downloaded DB files (dmrid, nxdn, ysf)

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

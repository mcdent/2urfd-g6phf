server {
    listen 80;
    server_name _;
    root /var/www/html;

    access_log /logs/nginx-access.log;
    error_log  /logs/nginx-error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Catch-all: 404 for anything not under /xlx
    location / {
        return 404;
    }

    # Redirect /xlx (no trailing slash) → /xlx/
    location = /xlx {
        return 301 /xlx/;
    }

    # urfd.xml — exact match takes priority over the ^~ prefix below
    location = /xlx/urfd.xml {
        alias /logs/urfd.xml;
        default_type application/xml;
    }

    # Strip /xlx/ prefix and re-evaluate with correct root.
    # ^~ prevents regex checks for this request; after the rewrite with
    # "last", nginx re-evaluates from scratch and the PHP/asset locations below match.
    location ^~ /xlx/ {
        rewrite ^/xlx/$          /index.php  last;
        rewrite ^/xlx/(.+)$      /$1         last;
    }

    # PHP handler (matched after rewrite strips /xlx/ prefix)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Static assets (matched after rewrite)
    location ~* \.(css|js|png|jpg|gif|ico|woff|woff2|ttf|eot|svg|map)$ {
        try_files $uri =404;
    }
}
